n:absolute;inset:0;border-radius:50%;overflow:hidden;border:6px solid #ffd76a;background:#1a1230;box-shadow:0 0 0 4px #0009,0 0 30px #ffcc4d88}#host-cam video,#host-cam canvas{width:100%;height:100%;object-fit:cover;display:block}#host-cam canvas{position:absolute;inset:0}#host-cam:not(.toon) canvas{display:none}#host-cam.toon video,#host-cam.toon i{display:none}#host-cam.mirror video{transform:scaleX(-1)}#host-cam b{position:absolute;left:50%;bottom:-20px;transform:translateX(-50%);background:linear-gradient(#ffe08a,#e8b440);color:#3a2300;font:900 26px 'Microsoft YaHei';padding:4px 22px;border-radius:20px;white-space:nowrap;box-shadow:0 3px 10px #0008}#host-cam i{position:absolute;inset:0;display:flex;white-space:pre-line;align-items:center;justify-content:center;color:#ffe9a8;font:700 24px 'Microsoft YaHei';font-style:normal;text-align:center}#host-cam.live i{display:none}body[data-mode=tarot] #host-cam{top:1540px;width:220px;height:220px}#waiting{color:#fff;padding:40px;font:24px sans-serif}</style><link rel="stylesheet" href="assets/live-rules.css"></head><body><div id="frame"><div id="scene"><div id="waiting">正在接入主窗口直播画面…</div></div><div id="host-cam" hidden><div class="ring"><video autoplay muted playsinline></video><canvas width="300" height="300"></canvas><i>正在打开摄像头…</i></div><b>🎙️ 主播</b></div><div id="overlays"></div><div id="label">头像打印小屋</div><div id="rules"><div class="live-rules" aria-label="评论打印头像，带皇冠猫耳墨镜像素素描复古生日锦鲤可定制款式，随机开出闪光款和传说款，爱心一张大图，啤酒两张大图，棒棒糖三张大图"><div class="rule-row comment-rule style-rule"><b>💬 评论点单</b><span>定制头像 · 随机开🌈传说款</span></div><div class="rule-row comment-rule style-menu"><span>贴纸：皇冠 猫耳 墨镜 光环 恶魔<br>画风：像素 素描 复古<br>主题：生日 锦鲤</span></div><div class="rule-row comment-rule fortune-rule"><b>🍀 报数字 1-99</b><span>抽今日幸运卡</span></div><div class="rule-row comment-rule keepsake-rule"><b>✍️ 评论「打字+内容」</b><span>打立体字摆件</span></div><div class="rule-row comment-rule keepsake-menu"><span>评论「属龙」「天蝎座」打生肖 / 星座摆件<br>🏆 每 10 分钟点赞最多 → 金色点赞王奖杯</span></div><div class="rule-row energy-rule"><b>⚡ 点赞攒能量</b><span>满格送能量款大头像</span></div><div class="rule-row"><img src="assets/generated/original-icons/heart.png" alt="爱心"><span>打印大图一张</span></div><div class="rule-row"><img src="assets/generated/original-icons/beer.png" alt="啤酒"><span>打印大图两张</span></div><div class="rule-row"><img src="assets/generated/original-icons/lollipop.png" alt="棒棒糖"><span>打印大图三张</span></div></div></div></div><script>function fit(){const scale=Math.min(innerWidth/1080,innerHeight/1920);const f=document.getElementById('frame');f.style.transform='scale('+scale+')';f.style.left=(innerWidth-1080*scale)/2+'px';f.style.top=(innerHeight-1920*scale)/2+'px'}addEventListener('resize',fit);fit();function hook(){const v=document.querySelector('#scene video');if(v&&v.srcObject&&v.srcObject.active)return;try{if(opener&&!opener.closed&&opener.__attachLive)opener.__attachLive(window)}catch(e){}}addEventListener('load',hook);setInterval(hook,1500);// 主播小窗：开关/大小/镜像存在 localStorage('host-cam')，打印页改设置后通过 storage 事件或 __hostCam() 通知这里。
const HC_KEY='host-cam';let hcStream=null,hcBusy=false;
let toon=null,toonRaf=0;const toonQ=[];window.__toonSpeech=ev=>{if(toon)toon.toonSpeech(toon.st,ev,performance.now());else toonQ.push(ev)};
async function toonLoop(on){const box=document.getElementById('host-cam'),cv=box.querySelector('canvas');if(!on){cancelAnimationFrame(toonRaf);toonRaf=0;return}if(!toon){const m=await import('./host-toon.mjs');toon={...m,st:m.createToonState()};for(const ev of toonQ.splice(0))m.toonSpeech(toon.st,ev,performance.now())}if(toonRaf)return;const ctx=cv.getContext('2d');const f=now=>{toon.drawToon(ctx,cv.width,toon.st,now);toonRaf=requestAnimationFrame(f)};toonRaf=requestAnimationFrame(f)}
function hcCfg(){const d={on:false,size:'m',mirror:true,kind:'toon'};try{return Object.assign(d,JSON.parse(localStorage.getItem(HC_KEY)||'{}'))}catch(e){return d}}
async function hostCam(){const c=hcCfg(),box=document.getElementById('host-cam'),v=box.querySelector('video'),tip=box.querySelector('i');box.dataset.size=c.size;box.classList.toggle('mirror',!!c.mirror);const isToon=c.kind!=='cam';box.classList.toggle('toon',isToon);box.querySelector('b').textContent=isToon?'🤖 主播小印':'🎙️ 主播';
 if(c.on&&isToon){box.hidden=false;if(hcStream){for(const t of hcStream.getTracks())t.stop();hcStream=null;v.srcObject=null}toonLoop(true);return}toonLoop(false);
 if(!c.on){box.hidden=true;box.classList.remove('live');if(hcStream){for(const t of hcStream.getTracks())t.stop();hcStream=null;v.srcObject=null}return}

 try{const s=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:720},height:{ideal:720},facingMode:'user'},audio:false});if(!hcCfg().on){for(const t of s.getTracks())t.stop();return}hcStream=s;v.srcObject=s;v.play().catch(()=>{});box.classList.add('live')}
 catch(e){box.classList.remove('live');const n=e&&e.name;tip.textContent=n==='NotAllowedError'||n==='SecurityError'?'摄像头未授权\n点地址栏🔒允许摄像头\n或 系统设置→隐私→摄像头 勾选 Chrome':n==='NotReadableError'||n==='AbortError'?'摄像头被占用\n关掉 OBS/腾讯会议/直播伴侣 等再试':n==='NotFoundError'||n==='OverconstrainedError'?'没有找到摄像头':'摄像头打开失败：'+(n||e);console.warn('主播小窗',e)}
 finally{hcBusy=false;if(!hcCfg().on)hostCam()}}
